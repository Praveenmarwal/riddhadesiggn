<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Gallery</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" rel="stylesheet">

<style>
.gallery img {
  width: 100%;
  height: 250px;
  object-fit: cover;
  cursor: pointer;
  border-radius: 10px;
  transition: 0.3s;
}
.gallery img:hover {
  transform: scale(1.05);
}

.swiper {
  width: 100%;
  height: 80vh;
}

.swiper-slide {
  display: flex;
  justify-content: center;
  align-items: center;
}

.swiper-slide img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
</style>
</head>
<body>

<div class="container py-5">
  <h2 class="text-center mb-4">Project Gallery</h2>
  <div class="row gallery" id="gallery"></div>
</div>

<!-- Modal -->
<div class="modal fade" id="imageModal" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content bg-dark position-relative">

      <!-- CLOSE BUTTON -->
      <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3"
        data-bs-dismiss="modal"></button>

      <div class="modal-body p-0">

        <div class="swiper mySwiper">
          <div class="swiper-wrapper" id="swiperWrapper"></div>

          <div class="swiper-button-next text-white"></div>
          <div class="swiper-button-prev text-white"></div>
          <div class="swiper-pagination"></div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script>
let swiper;

fetch('images.json')
.then(res => res.json())
.then(data => {

  let gallery = document.getElementById('gallery');
  let swiperWrapper = document.getElementById('swiperWrapper');

  data.forEach((img, index) => {

    gallery.innerHTML += `
      <div class="col-lg-3 col-md-4 col-6 mb-4">
        <img src="${img}" onclick="openModal(${index})">
      </div>
    `;

    swiperWrapper.innerHTML += `
      <div class="swiper-slide">
        <div class="swiper-zoom-container">
          <img src="${img}">
        </div>
      </div>
    `;
  });

  swiper = new Swiper(".mySwiper", {
    loop: true,
    navigation: {
      nextEl: ".swiper-button-next",
      prevEl: ".swiper-button-prev",
    },
    pagination: {
      el: ".swiper-pagination",
      clickable: true,
    },
    zoom: {
      maxRatio: 3,
      minRatio: 1
    }
  });

});

function openModal(index) {
  let modal = new bootstrap.Modal(document.getElementById('imageModal'));
  modal.show();

  setTimeout(() => {
    swiper.slideToLoop(index);
  }, 300);
}
</script>

</body>
</html>
