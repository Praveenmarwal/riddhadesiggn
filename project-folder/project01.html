<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Architecture Gallery</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" rel="stylesheet">

<style>
body{
    background:#f8f9fa;
    font-family: Arial, sans-serif;
}
.gallery img{
    width:100%;
    height:260px;
    object-fit:cover;
    border-radius:12px;
    cursor:pointer;
    transition:0.3s;
}
.gallery img:hover{
    transform:scale(1.05);
}
@media(max-width:768px){
    .gallery img{ height:200px; }
}
</style>
</head>
<body>

<div class="container py-5">
    <h2 class="text-center mb-5">Architecture Projects</h2>

    <div class="row g-4 gallery" id="gallery"></div>

    <div class="text-center mt-4">
        <a href="upload01.html" class="btn btn-dark">Upload Images</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>

<script>
let gallery = document.getElementById("gallery");
let images = JSON.parse(localStorage.getItem("architectureImages")) || [];

if(images.length === 0){
    gallery.innerHTML = "<p class='text-center'>No images uploaded yet.</p>";
}else{
    images.forEach(img=>{
        gallery.innerHTML += `
            <div class="col-lg-4 col-md-6 col-12">
                <a href="${img}" class="glightbox" data-gallery="gallery">
                    <img src="${img}" class="img-fluid shadow">
                </a>
            </div>
        `;
    });
}

const lightbox = GLightbox({
    selector: '.glightbox',
    loop: true,
    zoomable: true,
    draggable: true,
    touchNavigation: true
});
</script>

</body>
</html>
