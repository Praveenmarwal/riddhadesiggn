<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Upload Images</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
.preview img{
    height:120px;
    object-fit:cover;
    border-radius:10px;
}
</style>
</head>
<body>

<div class="container py-5">
    <h2 class="text-center mb-4">Upload Architecture Images</h2>

    <div class="card p-4 shadow">
        <input type="file" id="imageInput" class="form-control mb-3" multiple accept="image/*">
        <div class="row g-3 preview mb-3" id="preview"></div>
        <button onclick="saveImages()" class="btn btn-dark w-100">
            Save Images
        </button>
    </div>

    <div class="text-center mt-4">
        <a href="project01.html" class="btn btn-outline-secondary">
            View Gallery
        </a>
    </div>
</div>

<script>
let selectedImages = [];

document.getElementById("imageInput").addEventListener("change", function(e){
    let preview = document.getElementById("preview");
    preview.innerHTML = "";
    selectedImages = [];

    Array.from(e.target.files).forEach(file=>{
        let reader = new FileReader();
        reader.onload = function(event){
            selectedImages.push(event.target.result);
            preview.innerHTML += `
                <div class="col-4">
                    <img src="${event.target.result}" class="img-fluid shadow">
                </div>
            `;
        }
        reader.readAsDataURL(file);
    });
});

function saveImages(){
    if(selectedImages.length === 0){
        alert("Please select images first.");
        return;
    }

    let existing = JSON.parse(localStorage.getItem("architectureImages")) || [];
    let updated = existing.concat(selectedImages);

    localStorage.setItem("architectureImages", JSON.stringify(updated));

    alert("Images uploaded successfully!");
    window.location.href = "project01.html";
}
</script>

</body>
</html>
